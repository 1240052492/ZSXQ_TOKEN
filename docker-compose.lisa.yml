version: '3.8'

services:
  # PostgreSQL - 三库统一实例
  postgres:
    image: postgres:16-alpine
    container_name: zsxq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - zsxq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - 会话与缓存
  redis:
    image: redis:7-alpine
    container_name: zsxq-redis
    restart: unless-stopped
    command: redis-server --requirepass changeme-redis-password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - zsxq-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme-redis-password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # New API - Go 服务
  new-api:
    image: ghcr.io/1240052492/zsxq_token/new-api:v0.1.0
    container_name: zsxq-new-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${NEW_API_DB_USER}:${NEW_API_DB_PASSWORD}@postgres:5432/${NEW_API_DB_NAME}?sslmode=disable
      PORT: 8080
      GIN_MODE: release
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
    ports:
      - "8080:8080"
    networks:
      - zsxq-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Platform Gateway - Node.js 前端路由
  platform-gateway:
    image: ghcr.io/1240052492/zsxq_token/platform-gateway:v0.1.0
    container_name: zsxq-platform-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NEW_API_BASE_URL: http://new-api:8080
      CANVAS_APP_URL: http://super-canvas-adapter:3001
      OPC_PUBLIC_URL: http://opc-service:3002
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"
    networks:
      - zsxq-network
    depends_on:
      - new-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Super Canvas Adapter - TapCanvas 适配层
  super-canvas-adapter:
    image: ghcr.io/1240052492/zsxq_token/super-canvas-adapter:v0.1.1
    container_name: zsxq-super-canvas-adapter
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CANVAS_DB_HOST: postgres
      CANVAS_DB_PORT: 5432
      CANVAS_DB_NAME: ${CANVAS_DB_NAME}
      CANVAS_DB_USER: ${CANVAS_DB_USER}
      CANVAS_DB_PASSWORD: ${CANVAS_DB_PASSWORD}
      NEW_API_BASE_URL: http://new-api:8080
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports:
      - "3001:3001"
    networks:
      - zsxq-network
    depends_on:
      postgres:
        condition: service_healthy
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OPC Service - Agency Orchestrator 适配层
  opc-service:
    image: ghcr.io/1240052492/zsxq_token/opc-service:v0.1.0
    container_name: zsxq-opc-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPC_DB_HOST: postgres
      OPC_DB_PORT: 5432
      OPC_DB_NAME: ${OPC_DB_NAME}
      OPC_DB_USER: ${OPC_DB_USER}
      OPC_DB_PASSWORD: ${OPC_DB_PASSWORD}
      NEW_API_BASE_URL: http://new-api:8080
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      OPC_SSO_INTERNAL_TOKEN: ${OPC_SSO_INTERNAL_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3002:3002"
    networks:
      - zsxq-network
    depends_on:
      postgres:
        condition: service_healthy
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  zsxq-network:
    driver: bridge
    name: zsxq-network

volumes:
  postgres_data:
    name: zsxq-postgres-data
  redis_data:
    name: zsxq-redis-data
