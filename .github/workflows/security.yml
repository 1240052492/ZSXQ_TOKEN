name: Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked text for credential-shaped values
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E 'ghp_[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|AKIA[0-9A-Z]{16}' -- ':!docs/acceptance/evidence-template.md'; then
            echo 'Credential-shaped content detected.'
            exit 1
          fi
          echo 'No credential-shaped values found in tracked text.'
